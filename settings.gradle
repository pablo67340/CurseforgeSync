pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'curseforgesync'

// Every supported Minecraft version is a sibling project under ports/.
// The root project itself only aggregates; it produces no jar.
[
    '1.7.10',
    '1.12.2',
    '1.16.5',
    '1.19.2',
    '1.20.6',
    '1.21.11',
    '26.1.2',
    '26.2',
].each { mcVersion ->
    include ":ports:${mcVersion}"
    project(":ports:${mcVersion}").projectDir = file("ports/${mcVersion}")
}
