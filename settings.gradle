pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'curseforgesync'

// Every shipped jar is a sibling project under ports/: one universal jar for every modern
// loader, plus one per legacy Minecraft version whose loader API differs.
// The root project itself only aggregates; it produces no jar.
[
    'universal',
    '1.7.10',
    '1.12.2',
    '1.16.5',
].each { port ->
    include ":ports:${port}"
    project(":ports:${port}").projectDir = file("ports/${port}")
}
