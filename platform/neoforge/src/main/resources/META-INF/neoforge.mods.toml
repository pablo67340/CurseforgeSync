modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"
issueTrackerURL = "https://github.com/pablo67340/CurseforgeSync/issues"

# NeoForge's counterpart to mods.toml, present for tooling and for anyone inspecting the jar.
# Like Forge, NeoForge loads this jar as a ModLauncher service and leaves it out of mod scanning,
# so CurseforgeSync never appears in the mod list.

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[20.2,)"
    ordering = "NONE"
    side = "BOTH"
