# CurseforgeSync for Minecraft 1.21.11.

minecraft_version=1.21.11
minecraft_version_range=[1.21.11,1.22)
forge_version=61.2.0
forge_version_range=[61,)
loader_version_range=[61,)

# JDK used to compile. The shared sources are Java 8, and Java 17 bytecode loads
# fine on the Java 21/25 runtimes the newest Minecraft versions ship with, so the
# toolchain only ever needs to be as new as the loader API being compiled against.
java_version=17

# Loader-specific source trees, applied in order on top of common/.
platform=modlauncher-common,modlauncher

# Compile-only: the mod loading SPI for this era. Never shipped in the jar.
modlauncher_dependency=net.minecraftforge:modlauncher:10.2.6
service_class=com.curseforgesync.launch.CurseforgeSyncService
