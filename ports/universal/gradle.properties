# CurseforgeSync for every modern loader in one jar:
#   Forge 1.19.2 and newer, NeoForge (every version), Fabric and Quilt (every version).
#
# Nothing in the jar is tied to a Minecraft version. The Minecraft version and the loader are
# detected at launch (see GameInfo), and each loader finds its own hook:
#   Forge / NeoForge  META-INF/services ITransformationService -> CurseforgeSyncService
#   Fabric / Quilt    fabric.mod.json preLaunch entrypoint      -> CurseforgeSyncPreLaunch
# A new Minecraft version therefore needs no new port, only a new tag on the CurseForge upload.

# Blank: detected at runtime. Also drops the version from the jar name.
minecraft_version=
minecraft_version_range=[1.19.2,)
forge_version=
forge_version_range=[43,)
loader_version_range=[43,)

# Forge 1.19.2 is the oldest loader this jar serves, and it already requires Java 17.
java_version=17

# Loader-specific source trees, applied in order on top of common/.
platform=modlauncher-common,modlauncher,neoforge,fabric

# Compile-only APIs. Never shipped in the jar. ModLauncher 10 is binary compatible with the
# ModLauncher 11 that NeoForge ships, so one service class serves both.
modlauncher_dependency=cpw.mods:modlauncher:10.0.8
fabric_loader_dependency=net.fabricmc:fabric-loader:0.16.14
service_class=com.curseforgesync.launch.CurseforgeSyncService
