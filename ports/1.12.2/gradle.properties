# CurseforgeSync for Minecraft 1.12.2.
# LaunchWrapper coremod. Forge 14.23.5.2860 is the last 1.12.2 build.

minecraft_version=1.12.2
minecraft_version_range=[1.12.2,1.13)
forge_version=14.23.5.2860
forge_version_range=[14.23,)
loader_version_range=[14.23,)

# JDK used to compile. The shared sources are Java 8, and Java 17 bytecode loads
# fine on the Java 21/25 runtimes the newest Minecraft versions ship with, so the
# toolchain only ever needs to be as new as the loader API being compiled against.
java_version=8

# Loader-specific source trees, applied in order on top of common/.
platform=fml-common,fml1122

# Compile-only: carries FML's IFMLLoadingPlugin. Never shipped in the jar.
forge_universal=1.12.2-14.23.5.2860
coremod_class=com.curseforgesync.launch.CurseforgeSyncCoreMod
